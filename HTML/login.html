<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - Coding Conf</title>
        <link
            rel="icon"
            href="../assets/images/favicon-32x32.png"
            type="image/png"
       >
        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>
        <!-- Decorative background lines -->
        <img
            src="../assets/images/pattern-squiggly-line-top.svg"
            alt=""
            class="squiggle-top"
       >
        <img
            src="../assets/images/pattern-squiggly-line-bottom-desktop.svg"
            alt=""
            class="squiggle-bottom"
       >

        <!-- Header: logo and navigation -->
        <header>
            <img
                src="../assets/images/logo-full.svg"
                alt="Coding Conf Logo"
                class="logo"
           >

            <!-- Main navigation links -->
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="login.html" class="register-btn" aria-current="page"
                    >Register</a
                >
            </nav>
        </header>

        <!-- Main content - registration form -->
        <main>
            <h1>Your Journey to Coding Conf 2026 Starts Here!</h1>
            <p>Secure your spot at Coding Conf.</p>

            <section>
                <h2>Register for Coding Conf</h2>

                <!-- novalidate is here because checks are done in JavaScript -->
                <form id="registrationForm" novalidate>
                    <!-- Avatar -->
                    <label for="avatar">Upload Avatar</label>
                    <input
                        type="file"
                        id="avatar"
                        name="avatar"
                        accept=".jpg,.jpeg,.png"
                        aria-describedby="avatarHelp avatarError"
                   >
                    <p id="avatarHelp">
                        Upload your photo (JPG or PNG, max 500KB).
                    </p>
                    <p id="avatarError" aria-live="polite"></p>

                    <!-- Full name -->
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        aria-describedby="nameError"
                   >
                    <p id="nameError" aria-live="polite"></p>

                    <!-- Email -->
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        aria-describedby="emailError"
                   >
                    <p id="emailError" aria-live="polite"></p>

                    <!-- GitHub username -->
                    <label for="github">GitHub Username</label>
                    <input
                        type="text"
                        id="github"
                        name="github"
                        placeholder="@yourusername"
                        aria-describedby="githubError"
                   >
                    <p id="githubError" aria-live="polite"></p>

                    <button type="submit">Generate My Ticket</button>
                </form>
            </section>
        </main>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 Coding Conf. All rights reserved.</p>
        </footer>

        <!-- Form validation script -->
        <script src="../js/validation.js"></script>
    </body>
</html>
