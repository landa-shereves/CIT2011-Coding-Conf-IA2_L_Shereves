<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Your Ticket - Coding Conf</title>
        <link
            rel="icon"
            href="../assets/images/favicon-32x32.png"
            type="image/png"
       >
        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>
        <!-- Decorative background lines -->
        <img
            src="../assets/images/pattern-squiggly-line-top.svg"
            alt=""
            class="squiggle-top"
       >
        <img
            src="../assets/images/pattern-squiggly-line-bottom-desktop.svg"
            alt=""
            class="squiggle-bottom"
       >

        <!-- Header: logo, nav and congrats message -->
        <header>
            <img
                src="../assets/images/logo-full.svg"
                alt="Coding Conf Logo"
                class="logo"
           >

            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="login.html" class="register-btn">Register</a>
            </nav>

            <h1>
                Congrats, <span id="congratsName"></span>! Your ticket is ready.
            </h1>

            <p>We're excited to see you at Coding Conf 2026!</p>
        </header>

        <!-- Main content for generated ticket -->
        <main>
            <!-- Glassmorphic ticket card (filled in by ticket.js) -->
            <section class="ticket">
                <!-- Ticket logo, title and event details -->
                <img
                    src="../assets/images/logo-mark.svg"
                    alt="Coding Conf Icon"
                    class="ticket-logo"
               >

                <h2>Coding Conf 2026</h2>
                <p>October 26, 2026</p>
                <p>Papine, Kgn</p>

                <!-- Tear line between the event and attendee details -->
                <hr>

                <!-- Attendee avatar (replaced with uploaded photo) -->
                <img
                    id="ticketAvatar"
                    src="../assets/images/image-avatar.jpg"
                    alt="Attendee Avatar"
               >

                <!-- Attendee name (filled in by ticket.js) -->
                <h3 id="ticketName">Attendee Name</h3>

                <!-- GitHub icon and profile link -->
                <p>
                    <img
                        src="../assets/images/icon-github.svg"
                        alt=""
                        class="github-icon"
                   >
                    <a id="ticketGitHub" href="#" target="_blank"></a>
                </p>

                <!-- Ticket number (generated in validation.js) -->
                <p>
                    Ticket Number:
                    <span id="ticketNumber"></span>
                </p>
            </section>
        </main>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 Coding Conf. All rights reserved.</p>
        </footer>

        <!-- Ticket script that reads saved data and fills the page -->
        <script src="../js/ticket.js"></script>
    </body>
</html>
